version: '3.8'
services:
  php:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    restart: always
    depends_on: ["db"]
    volumes:
      - .:/var/www/html/

  nginx:
    build:
      context: .
      dockerfile: docker/Nginx.Dockerfile
    restart: always
    depends_on: ["php"]
    ports: ["3003:80"]
    volumes:
      - .:/var/www/html/
  db:
      image: mysql:8.0
      platform: linux/arm64
      restart: always
      environment:
        MYSQL_ROOT_PASSWORD: bf
        MYSQL_DATABASE: bf
        MYSQL_USER: bf
        MYSQL_PASSWORD: bf
      ports:
        - "33062:3306"
      volumes:
        - "./../volumes/blue_flame_mysql:/var/lib/mysql:rw"

  adminer:
    image: arm64v8/adminer
    platform: linux/arm64
    restart: always
    depends_on: ["db"]
    ports:
      - 82:8080



